<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Meshview</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    {% block head %}{% endblock %}

    <style>
        body {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        body.ready {
            opacity: 1;
        }

        .htmx-indicator {
            opacity: 0;
            transition: opacity 500ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }

        #search_form {
            z-index: 4000;
        }

        #details_map {
            width: 100%;
            height: 500px;
        }

        #site-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0 1rem;
            text-align: center;
        }

        #site-logo {
            max-height: 64px;
            max-width: min(240px, 80vw);
            object-fit: contain;
        }

        #site-logo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        {% block css %}{% endblock %}
    </style>
</head>

<body>
<br>
<div style="text-align:center" id="site-header"></div>
<div style="text-align:center" id="site-message"></div>
<div style="text-align:center" id="site-menu"></div>

<br>

{% block body %}{% endblock %}

<br>
<div style="text-align:center" id="footer" data-translate="footer"></div>
<div style="text-align:center"><small id="site-version">ver. unknown</small></div>
<br>

<script>
// --- Shared Promises ---
if (!window._siteConfigPromise) {
    window._siteConfigPromise = (async () => {
        try {
            const res = await fetch("/api/config");
            const cfg = await res.json();
            window._siteConfig = cfg;
            console.log("Loaded config:", cfg);
            return cfg;
        } catch (err) {
            console.error("Failed to load /api/config:", err);
            return {};
        }
    })();
}

// --- Load language AFTER config ---
if (!window._langPromise) {
    window._langPromise = (async () => {
        try {
            const cfg = await window._siteConfigPromise;
            const site = cfg.site || {};
            const userLang = site.language || "en";
            const section = "base";

            const url = `/api/lang?lang=${userLang}&section=${section}`;
            const res = await fetch(url);
            const lang = await res.json();

            window._lang = lang;
            console.log(`Loaded language (${userLang}):`, lang);

            return lang;
        } catch (err) {
            console.error("Failed to load language:", err);
            return {};
        }
    })();
}

// --- Translation Helper ---
function applyTranslations(dict) {
    document.querySelectorAll("[data-translate]").forEach(el => {
        const key = el.dataset.translate;
        const value = dict[key];
        if (!value) return;

        if (el.placeholder) {
            el.placeholder = value;
        } else if (el.tagName === "INPUT" && el.value) {
            el.value = value;
        } else if (key === "footer") {
            el.innerHTML = value;
        } else {
            el.textContent = value;
        }
    });
}

// --- Fill portnum select dynamically ---
function fillPortnumSelect(dict, selectedValue) {
    const sel = document.getElementById("portnum_select");
    if (!sel) return;

    const portOptions = dict.portnum_options || {};
    sel.innerHTML = "";

    const allOption = document.createElement("option");
    allOption.value = "";
    allOption.textContent = dict.all || "All";
    if (!selectedValue) allOption.selected = true;
    sel.appendChild(allOption);

    for (const [val, label] of Object.entries(portOptions)) {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = label;
        if (parseInt(val) === parseInt(selectedValue)) {
            opt.selected = true;
        }
        sel.appendChild(opt);
    }
}

function renderFooter(site, dict) {
    const footer = document.getElementById("footer");
    if (!footer) return;

    if (site.contact_email) {
        footer.innerHTML = "";
        const contactLink = document.createElement("a");
        contactLink.href = `mailto:${site.contact_email}`;
        contactLink.textContent = site.contact_email;
        footer.append("Contact: ", contactLink);
        return;
    }

    footer.innerHTML = dict.footer || "";
}

// --- Main Init ---
async function initializePage() {
    try {
        const [cfg, lang] = await Promise.all([
            window._siteConfigPromise,
            window._langPromise
        ]);

        const dict = lang || {};
        const site = cfg.site || {};
        const titleText = `${site.title || ""}${site.domain ? " (" + site.domain + ")" : ""}`;

        // Title
        document.title = "Meshview - " + (site.title || "");

        // Header & Message
        const siteHeader = document.getElementById("site-header");
        siteHeader.innerHTML = "";

        if (site.logo) {
            const logo = document.createElement("img");
            logo.id = "site-logo";
            logo.src = site.logo;
            logo.alt = site.title ? `${site.title} logo` : "Site logo";

            if (site.logo_height) {
                logo.style.maxHeight = site.logo_height;
                logo.style.height = site.logo_height;
            }

            if (site.logo_link) {
                const logoLink = document.createElement("a");
                logoLink.id = "site-logo-link";
                logoLink.href = site.logo_link;
                logoLink.target = "_blank";
                logoLink.rel = "noopener noreferrer";
                logoLink.appendChild(logo);
                siteHeader.appendChild(logoLink);
            } else {
                siteHeader.appendChild(logo);
            }
        }

        const title = document.createElement("strong");
        title.textContent = titleText;
        siteHeader.appendChild(title);

        document.getElementById("site-message").textContent = site.message || "";

        // Menu
        const menu = document.getElementById("site-menu");
        if (menu) {
            const items = [];
            const keys = ["nodes", "chat", "everything", "graphs", "net", "map", "stats", "top"];
            const urls = ["/nodelist", "/chat", "/firehose", "/nodegraph", "/net", "/map", "/stats", "/top"];

            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                if (site[key] === "true") {
                    items.push(`<a href="${urls[i]}">${dict[key] || key}</a>`);
                }
            }
            items.push('<a href="https://meshview.world" target="_blank" rel="noopener noreferrer">MeshviewWorld</a>');

            menu.innerHTML = items.join("&nbsp;-&nbsp;");
        }

        // Version
        document.getElementById("site-version").textContent =
            "ver. " + (site.version || "unknown");

        // Apply translations
        applyTranslations(dict);
        renderFooter(site, dict);
        fillPortnumSelect(dict, "{{ portnum or '' }}");

        document.body.classList.add("ready");
    } catch (err) {
        console.error("Failed to initialize page:", err);
        document.body.classList.add("ready");
    }
}

document.addEventListener("DOMContentLoaded", initializePage);
</script>

</body>
</html>
